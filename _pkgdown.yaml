title: ReLTER
url: https://docs.ropensci.org/ReLTER/
lang: en
template:
  package: rotemplate
  bootstrap: 5
  params:
    mathjax: true
  opengraph:
    image:
      src: https://raw.githubusercontent.com/ropensci/ReLTER/main/man/figures/logo.png
      alt: "ReLTER logo"
  includes:
    in_header: |
      <script defer data-domain="docs.ropensci.org/relter" src="https://plausible.io/js/plausible.js"></script>
reference:
  - title: All functions
    contents:
    - get_site_info
    - get_activity_info
    - get_dataset_info
    - get_location_info
    - get_sensor_info
    - get_site_EcoDataCube
    - EDC_construct_full_url
    - get_site_speciesOccurrences
    - get_sites_interactive
    - get_sites_within_3d_bounding_box
    - get_sites_within_radius
    - get_network_sites
    - get_zenodo_data
    - get_deims_API_version
    - get_deims_base_url
    - set_deims_base_url
    - package_settings
    - produce_network_points_map
    - produce_site_map
    - produce_site_qrcode
    - produce_site_observedProperties_pie
    - produce_site_observedProperties_waffle
    - taxon_id_pesi
    - taxon_id_worms
    - map_occ_gbif2elter
    - map_occ_inat2elter
    - map_occ_obis2elter
    - save_occ_eLTER_reporting_Archive
    - eLTER_data_reporting_format
    - reporting_produce_data_object_v1.3
    - reporting_produce_data_object_v2.0
    - reporting_save_archive
navbar:
  structure:
    left: [reference, articles, news]
    right: [github, zenodo]
  components:
    zenodo:
      text: Zenodo
      href: https://doi.org/10.5281/zenodo.5576813
    github:
      icon: fa-github
      aria-label: GitHub repository
      href: https://github.com/ropensci/ReLTER
authors:
  Alessandro Oggioni:
    href: https://orcid.org/0000-0002-7997-219X
  Micha Silver:
    href: https://orcid.org/0000-0002-1128-1325
  Luigi Ranghetti:
    href: https://orcid.org/0000-0001-6207-5188
  Paolo Tagliolato:
    href: https://orcid.org/0000-0002-0261-313X
footer:
  structure:
    right: [built_with]
